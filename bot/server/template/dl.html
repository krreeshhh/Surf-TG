<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/src/ico2.png" type="image/x-icon">
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/src/ico2.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Xibflix — <!-- Filename --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <style>
        :root {
            --color-netflix-red: #e50914;
            --color-feature-card-gradient: #1d153f;
            --gradient-feature-card-gradient: linear-gradient(149deg, #192247, #210e17);
            --color-deep-space: #000000;
            --color-graphite: #2d2d2d;
            --color-charcoal: #414141;
            --color-slate: #5a5a5a;
            --color-ash: #808080;
            --color-silver: #b3b3b3;
            --color-chalk-white: #ffffff;
            --font-netflix-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-cards: 16px;
            --radius-inputs: 4px;
            --radius-buttons: 4px;
            --page-max-width: 720px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-deep-space);
            color: var(--color-chalk-white);
            font-family: var(--font-netflix-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-charcoal);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-slate);
        }

        /* Navbar */
        .netflix-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--color-netflix-red) !important;
            text-transform: uppercase;
        }

        .btn-netflix-header {
            background: rgba(0, 0, 0, 0.4);
            color: var(--color-chalk-white);
            border: 1px solid var(--color-ash);
            border-radius: var(--radius-buttons);
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-netflix-header:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-chalk-white);
            border-color: var(--color-chalk-white);
        }

        /* Download Stage */
        .download-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .download-card {
            width: 100%;
            max-width: var(--page-max-width);
            background: var(--gradient-feature-card-gradient);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-cards);
            padding: 48px 40px;
            text-align: center;
            position: relative;
        }

        .file-icon-badge {
            width: 72px;
            height: 72px;
            background: rgba(229, 9, 20, 0.15);
            border: 1px solid var(--color-netflix-red);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--color-netflix-red);
            margin-bottom: 24px;
        }

        .file-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--color-chalk-white);
            margin-bottom: 16px;
            word-break: break-word;
            line-height: 1.3;
        }

        .file-meta-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }

        .meta-pill {
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-silver);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .meta-pill.highlight {
            background: rgba(229, 9, 20, 0.15);
            border-color: rgba(229, 9, 20, 0.5);
            color: var(--color-chalk-white);
        }

        .actions-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn-cta-netflix {
            background: var(--color-netflix-red);
            color: var(--color-chalk-white);
            border: none;
            border-radius: var(--radius-buttons);
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-cta-netflix:hover {
            background: #c10712;
            color: var(--color-chalk-white);
        }

        .btn-cta-netflix:active {
            transform: scale(0.98);
        }

        .btn-action-netflix {
            background: rgba(22, 22, 22, 0.7);
            color: var(--color-chalk-white);
            border: 1px solid var(--color-slate);
            border-radius: var(--radius-buttons);
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action-netflix:hover {
            background: var(--color-charcoal);
            border-color: var(--color-chalk-white);
            color: var(--color-chalk-white);
        }

        /* Footer */
        .footer {
            padding: 32px 36px;
            font-size: 13px;
            color: var(--color-silver);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--color-deep-space);
            text-align: center;
        }

        .footer a {
            color: var(--color-silver);
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--color-chalk-white);
        }

        @media (max-width: 600px) {
            .netflix-navbar {
                padding: 14px 20px;
            }
            .download-card {
                padding: 32px 20px;
            }
            .file-title {
                font-size: 20px;
            }
            .actions-row {
                flex-direction: column;
                width: 100%;
            }
            .btn-cta-netflix, .btn-action-netflix {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Netflix Navigation -->
    <header class="netflix-navbar">
        <a class="brand-logo" href="/">
            XIBFLIX
        </a>
        <form id="signoutForm" action="/logout" method="post" class="m-0" role="logout">
            <button type="submit" class="btn-netflix-header"><i class="bi bi-box-arrow-left"></i> Sign Out</button>
        </form>
    </header>

    <main class="download-wrapper">
        <div class="download-card">
            <div class="file-icon-badge">
                <i class="bi bi-cloud-arrow-down-fill"></i>
            </div>
            <h1 class="file-title"><!-- Filename --></h1>
            <div class="file-meta-row">
                <span class="meta-pill highlight"><i class="bi bi-hdd-fill"></i> <!-- Size --></span>
                <span class="meta-pill"><i class="bi bi-lightning-charge-fill"></i> High-Speed Stream</span>
                <span class="meta-pill"><i class="bi bi-shield-lock-fill"></i> Verified MTProto</span>
            </div>
            <div class="actions-row">
                <button onclick="download()" class="btn-cta-netflix">
                    <i class="bi bi-download"></i> Download File
                </button>
                <button onclick="copyUrl()" class="btn-action-netflix">
                    <i class="bi bi-clipboard"></i> Copy Link
                </button>
                <button onclick="get_file()" class="btn-action-netflix">
                    <i class="bi bi-telegram"></i> Telegram Link
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div>
            Xibflix Digital Shelf &bull; Theatrical Streaming Experience &bull;
            &copy; 2026 Xibflix
        </div>
    </footer>

    <script>
        const videolink = window.location.href;
        const url = new URL(videolink);
        const domainUrl = url.origin;
        const videoIdWithParams = videolink.split('/').pop();
        const videoId = videoIdWithParams.split('?')[0];
        const idParam = new URLSearchParams(window.location.search).get('id');
        const hashParam = new URLSearchParams(window.location.search).get('hash');
        const encodedName = encodeURIComponent('<!-- Filename -->');

        const downloadlink = `${domainUrl}/${videoId}/${encodedName}?id=${idParam}&hash=${hashParam}`;

        function download() {
            window.location.href = downloadlink;
        }

        function get_file() {
            const regex = /(\d+)\?id=(\d+)&/;
            const match = videolink.match(regex);
            if (match) {
                const chatId = "-100" + match[1];
                const messageId = match[2];
                window.location.href = `https://t.me/<!-- Username -->?start=file_${messageId}${chatId}`;
            }
        }

        function copyUrl() {
            navigator.clipboard.writeText(downloadlink)
                .then(() => {
                    alert('Direct download URL copied to clipboard!');
                })
                .catch((error) => {
                    console.error('Failed to copy URL: ', error);
                });
        }
    </script>
</body>

</html>
