<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/src/ico2.png" type="image/x-icon">
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/src/ico2.png" type="image/x-icon">
    <title>Surf-TG — <!-- Title --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/js/SurfTG.js"></script>
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <style>
        :root {
            --color-netflix-red: #e50914;
            --color-feature-card-gradient: #1d153f;
            --gradient-feature-card-gradient: linear-gradient(149deg, #192247, #210e17);
            --color-deep-space: #000000;
            --color-graphite: #2d2d2d;
            --color-charcoal: #414141;
            --color-slate: #5a5a5a;
            --color-ash: #808080;
            --color-silver: #b3b3b3;
            --color-chalk-white: #ffffff;
            --font-netflix-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-cards: 16px;
            --radius-inputs: 4px;
            --radius-buttons: 4px;
            --page-max-width: 1280px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-deep-space);
            color: var(--color-chalk-white);
            font-family: var(--font-netflix-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-charcoal);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-slate);
        }

        /* Navbar */
        .netflix-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--color-netflix-red) !important;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-netflix-header {
            background: rgba(0, 0, 0, 0.4);
            color: var(--color-chalk-white);
            border: 1px solid var(--color-ash);
            border-radius: var(--radius-buttons);
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-netflix-header:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-chalk-white);
            border-color: var(--color-chalk-white);
        }

        .btn-netflix-red {
            background: var(--color-netflix-red);
            color: var(--color-chalk-white);
            border: none;
            border-radius: var(--radius-buttons);
            padding: 6px 18px;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .btn-netflix-red:hover {
            background: #c10712;
            color: var(--color-chalk-white);
        }

        /* Channel Header Bar */
        .channel-header-wrapper {
            max-width: var(--page-max-width);
            margin: 0 auto;
            width: 100%;
            padding: 40px 36px 20px;
        }

        .channel-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .channel-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--color-chalk-white);
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
        }

        .channel-title::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 28px;
            background: var(--color-netflix-red);
            border-radius: 2px;
        }

        /* Netflix Hero Search Input */
        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .search-input-netflix {
            flex: 1;
            background: rgba(22, 22, 22, 0.7);
            border: 1px solid var(--color-slate);
            color: var(--color-chalk-white);
            font-size: 16px;
            border-radius: var(--radius-inputs);
            padding: 14px 18px;
            transition: border-color 0.2s ease;
        }

        .search-input-netflix:focus {
            background: rgba(30, 30, 30, 0.9);
            border-color: var(--color-chalk-white);
            color: var(--color-chalk-white);
            outline: none;
        }

        .search-input-netflix::placeholder {
            color: var(--color-ash);
        }

        .search-btn-netflix {
            background: var(--color-netflix-red);
            color: var(--color-chalk-white);
            border: none;
            border-radius: var(--radius-buttons);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .search-btn-netflix:hover {
            background: #c10712;
        }

        /* Grid & Cards */
        .files-container {
            max-width: var(--page-max-width);
            margin: 0 auto;
            width: 100%;
            padding: 0 36px 48px;
            flex: 1;
        }

        .card {
            background: var(--gradient-feature-card-gradient) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: var(--radius-cards) !important;
            overflow: hidden;
            box-shadow: none !important;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), border-color 0.25s ease !important;
            position: relative;
        }

        .card:hover {
            transform: scale(1.04) translateY(-4px) !important;
            border-color: rgba(229, 9, 20, 0.6) !important;
        }

        .card .card-img-top {
            aspect-ratio: 16/9;
            object-fit: cover;
            border-top-left-radius: var(--radius-cards);
            border-top-right-radius: var(--radius-cards);
        }

        .card .card-body {
            background: transparent !important;
            padding: 12px 14px !important;
        }

        .card .card-title {
            font-size: 14px !important;
            font-weight: 700 !important;
            color: var(--color-chalk-white) !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .card .badge {
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            padding: 3px 8px;
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-silver) !important;
        }

        .card .badge.bg-warning, .card .badge.bg-info {
            background: rgba(229, 9, 20, 0.15) !important;
            border-color: rgba(229, 9, 20, 0.5) !important;
            color: var(--color-chalk-white) !important;
        }

        /* Checkbox styling */
        .form-check-input {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--color-slate);
            border-radius: 4px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            z-index: 10;
        }

        .form-check-input:checked {
            background-color: var(--color-netflix-red);
            border-color: var(--color-netflix-red);
        }

        /* Pagination */
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }

        .pagination {
            display: flex;
            gap: 12px;
        }

        .page-link {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid var(--color-slate) !important;
            color: var(--color-chalk-white) !important;
            border-radius: var(--radius-buttons) !important;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .page-link:hover {
            background: var(--color-charcoal) !important;
            border-color: var(--color-chalk-white) !important;
            color: var(--color-chalk-white) !important;
        }

        /* Modals */
        .modal-content {
            background-color: #141414 !important;
            border: 1px solid var(--color-charcoal) !important;
            border-radius: var(--radius-cards) !important;
            color: var(--color-chalk-white) !important;
            padding: 12px;
        }

        .modal-body label {
            font-size: 13px;
            font-weight: 500;
            color: var(--color-silver);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background-color: rgba(22, 22, 22, 0.8) !important;
            border: 1px solid var(--color-slate) !important;
            color: var(--color-chalk-white) !important;
            border-radius: var(--radius-inputs) !important;
            padding: 10px 14px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--color-chalk-white) !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* Footer */
        .footer {
            padding: 32px 36px;
            font-size: 13px;
            color: var(--color-silver);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--color-deep-space);
            text-align: center;
        }

        .footer a {
            color: var(--color-silver);
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--color-chalk-white);
        }

        @media (max-width: 768px) {
            .netflix-navbar {
                padding: 14px 20px;
            }
            .channel-header-wrapper, .files-container {
                padding: 24px 20px;
            }
            .channel-title {
                font-size: 24px;
            }
            .search-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- Send File to Folder Modal -->
    <div class="admin-only modal fade" id="sendFileModal" aria-labelledby="sendFileModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-weight-bold">Add Selected to Playlist</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="/send" method="post" id="sendPopupForm">
                        <input type="hidden" id="chatId" name="chatId" value="<!-- Chat_id -->">
                        <input type="hidden" id="selectedIds" name="selectedIds">
                        <label for="folderSearch">Search Destination Folder:</label>
                        <input type="text" class="form-control mb-3" id="folderSearch" name="folderSearch" placeholder="Type to filter folders...">
                        <label for="folderDropdown">Select Folder:</label>
                        <select class="form-select mb-4" id="folderDropdown"></select>
                        <input type="hidden" id="folderId" name="folderId">

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn-netflix-header" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn-netflix-red" onclick="submitSendForm()" id="sendButton" disabled>
                                Confirm & Add
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Netflix Navigation -->
    <header class="netflix-navbar">
        <a class="brand-logo" href="/">
            SURF-TG
        </a>
        <div class="header-actions">
            <form action="/reload" method="get" role="reload" class="admin-only m-0">
                <button type="submit" class="btn-netflix-header" name="chatId" value="<!-- Chat_id -->" title="Reload channel index">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </form>
            <form id="signoutForm" action="/logout" method="post" class="m-0" role="logout">
                <button type="submit" class="btn-netflix-header"><i class="bi bi-box-arrow-left"></i> Sign Out</button>
            </form>
        </div>
    </header>

    <!-- Channel Title and Controls -->
    <div class="channel-header-wrapper">
        <div class="channel-title-row">
            <h1 class="channel-title"><!-- Title --></h1>
            <button type="button" class="admin-only btn-netflix-red" data-bs-toggle="modal" data-bs-target="#sendFileModal" onclick="sendPopupForm()">
                <i class="bi bi-folder-symlink"></i> Add to Playlist
            </button>
        </div>

        <form class="search-container" action="/search/<!-- Chat_id -->" method="get">
            <input class="search-input-netflix" type="search" placeholder="Search movies, videos, documents..." name="q" autocomplete="off">
            <button class="search-btn-netflix" type="submit">
                <i class="bi bi-search"></i> Search
            </button>
        </form>
    </div>

    <!-- Media File Grid -->
    <main class="files-container">
        <div class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-3">
            <!-- Print -->
        </div>

        <div class="pagination-wrapper">
            <ul class="pagination">
                <li class="page-item">
                    <a class="page-link" id="prevButton" href="#">Previous</a>
                </li>
                <li class="page-item">
                    <a class="page-link" id="nextButton" href="#">Next</a>
                </li>
            </ul>
        </div>
    </main>

    <footer class="footer">
        <div>
            Surf-TG Digital Shelf &bull; Theatrical Streaming Experience &bull;
            &copy; 2026 <a href="https://github.com/weebzone/Surf-TG" target="_blank" rel="noreferrer">Surf-TG</a>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const prevButton = document.getElementById("prevButton");
            const nextButton = document.getElementById("nextButton");

            const url = new URL(window.location.href);
            const chatId = url.pathname.match(/\/(channel|search)\/(-?\d+)/) ? url.pathname.match(/\/(channel|search)\/(-?\d+)/)[2] : null;
            const currentPage = url.searchParams.get("page") ? parseInt(url.searchParams.get("page")) : 1;

            if (currentPage <= 1 && prevButton) {
                prevButton.classList.add("disabled");
            }

            if (prevButton) {
                prevButton.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (currentPage > 1) {
                        navigateChannel(url.origin + url.pathname, currentPage - 1);
                    }
                });
            }

            if (nextButton) {
                nextButton.addEventListener("click", function (e) {
                    e.preventDefault();
                    navigateChannel(url.origin + url.pathname, currentPage + 1);
                });
            }
        });

        function navigateChannel(url, page) {
            const match = url.match(/\/(channel|search)\/(-?\d+)/);
            const chatId = match ? match[2] : null;

            if (!chatId) {
                alert("Invalid channel URL.");
                return;
            }

            const searchParams = new URLSearchParams(window.location.search);
            const searchQuery = searchParams.get('q');
            page = parseInt(page) || 1;

            let newUrl = url;
            if (searchQuery || page > 1) {
                newUrl += searchQuery ? `?q=${searchQuery}` : '';
                newUrl += page > 1 ? `${searchQuery ? '&' : '?'}page=${page}` : '';
            }

            window.location.href = newUrl;
        }
    </script>
</body>

</html>
