<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/api/logo" type="image/png">
    <link rel="shortcut icon" href="/api/logo" type="image/png">
    <title>Xibflix — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-netflix-red: #e50914;
            --color-deep-space: #000000;
            --color-graphite: #2d2d2d;
            --color-charcoal: #414141;
            --color-slate: #5a5a5a;
            --color-ash: #808080;
            --color-silver: #b3b3b3;
            --color-chalk-white: #ffffff;
            --font-netflix-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-cards: 16px;
            --radius-inputs: 4px;
            --radius-buttons: 4px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 25%, rgba(25, 34, 71, 0.45) 0%, rgba(33, 14, 23, 0.35) 45%, #000000 85%), #000000;
            color: var(--color-chalk-white);
            font-family: var(--font-netflix-sans);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-charcoal);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-slate);
        }

        /* Netflix Header */
        .header-bar {
            padding: 24px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--color-netflix-red);
            text-decoration: none;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo:hover {
            color: var(--color-netflix-red);
        }

        /* Sign-In Card */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-cards);
            padding: 48px 40px;
            position: relative;
            z-index: 2;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--color-chalk-white);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--color-silver);
            margin-bottom: 28px;
        }

        .form-floating-custom {
            margin-bottom: 16px;
        }

        .form-floating-custom label {
            display: block;
            font-size: 13px;
            color: var(--color-silver);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-control-netflix {
            width: 100%;
            background: rgba(22, 22, 22, 0.7);
            border: 1px solid var(--color-slate);
            color: var(--color-chalk-white);
            font-size: 16px;
            border-radius: var(--radius-inputs);
            padding: 14px 16px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-control-netflix:focus {
            background: rgba(30, 30, 30, 0.9);
            border-color: var(--color-chalk-white);
            color: var(--color-chalk-white);
            outline: none;
            box-shadow: none;
        }

        .form-control-netflix::placeholder {
            color: var(--color-ash);
        }

        .btn-netflix {
            width: 100%;
            background: var(--color-netflix-red);
            color: var(--color-chalk-white);
            font-size: 16px;
            font-weight: 700;
            border-radius: var(--radius-buttons);
            padding: 14px 24px;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 12px;
        }

        .btn-netflix:hover {
            background: #c10712;
            color: var(--color-chalk-white);
        }

        .btn-netflix:active {
            transform: scale(0.99);
        }

        .alert-netflix {
            background: rgba(229, 9, 20, 0.18);
            border: 1px solid var(--color-netflix-red);
            color: var(--color-chalk-white);
            border-radius: var(--radius-inputs);
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        /* Footer */
        .footer {
            padding: 24px 48px;
            text-align: center;
            font-size: 13px;
            color: var(--color-silver);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--color-deep-space);
        }

        .footer a {
            color: var(--color-silver);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--color-chalk-white);
        }

        @media (max-width: 600px) {
            .header-bar {
                padding: 16px 20px;
            }
            .login-card {
                padding: 32px 24px;
            }
            .footer {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header class="header-bar">
        <a href="/">
            <img src="/api/logo" alt="XIBFLIX" style="height: 46px; object-fit: contain;">
        </a>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <h1 class="login-title">Sign In</h1>
            <p class="login-subtitle">The Infinite Digital Shelf. Stream & download your Telegram library.</p>

            <div class="alert-netflix" id="errorPopup">
                <strong><!-- Error --></strong>
            </div>

            <form id="signinForm" action="/login" method="post">
                <input type="hidden" name="redirect_url" value="<!-- RedirectURL -->">
                
                <div class="form-floating-custom">
                    <label for="exampleInputUsername">Username</label>
                    <input type="text" class="form-control-netflix" id="exampleInputUsername" name="username"
                        placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="form-floating-custom">
                    <label for="exampleInputPassword1">Password</label>
                    <input type="password" class="form-control-netflix" id="exampleInputPassword1" name="password"
                        placeholder="Password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-netflix">Sign In</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div>
            Xibflix Digital Shelf &bull; Powered by Telegram MTProto & MongoDB &bull;
            &copy; 2026 Xibflix
        </div>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            var errorPopup = document.getElementById("errorPopup");
            var errorText = errorPopup.querySelector("strong").innerText.trim();
            if (errorText && errorText.length > 0 && errorText !== "<!-- Error -->") {
                errorPopup.style.display = "block";
                setTimeout(function () {
                    errorPopup.style.display = "none";
                }, 5000);
            }
        });
    </script>
</body>

</html>
