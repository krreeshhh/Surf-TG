<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/src/ico2.png" type="image/x-icon">
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/src/ico2.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Surf-TG — <!-- Filename --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/css/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <style>
        :root {
            --color-netflix-red: #e50914;
            --color-feature-card-gradient: #1d153f;
            --gradient-feature-card-gradient: linear-gradient(149deg, #192247, #210e17);
            --color-deep-space: #000000;
            --color-graphite: #2d2d2d;
            --color-charcoal: #414141;
            --color-slate: #5a5a5a;
            --color-ash: #808080;
            --color-silver: #b3b3b3;
            --color-chalk-white: #ffffff;
            --font-netflix-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-cards: 16px;
            --radius-inputs: 4px;
            --radius-buttons: 4px;
            --page-max-width: 1100px;
            --plyr-color-main: #e50914;
            --plyr-video-background: #000000;
            --plyr-control-radius: 4px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-deep-space);
            color: var(--color-chalk-white);
            font-family: var(--font-netflix-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-charcoal);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-slate);
        }

        /* Navbar */
        .netflix-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--color-netflix-red) !important;
            text-transform: uppercase;
        }

        .btn-netflix-header {
            background: rgba(0, 0, 0, 0.4);
            color: var(--color-chalk-white);
            border: 1px solid var(--color-ash);
            border-radius: var(--radius-buttons);
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-netflix-header:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-chalk-white);
            border-color: var(--color-chalk-white);
        }

        /* Theater Container */
        .theater-wrapper {
            max-width: var(--page-max-width);
            margin: 32px auto 48px;
            width: 100%;
            padding: 0 24px;
            flex: 1;
        }

        .video-player-container {
            width: 100%;
            background: #000000;
            border-radius: var(--radius-cards);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        .plyr {
            border-radius: var(--radius-cards);
            max-height: 70vh;
        }

        .plyr__control--overlaid {
            background: rgba(229, 9, 20, 0.9) !important;
            padding: 18px !important;
        }

        .plyr--video .plyr__control.plyr__tab-focus,
        .plyr--video .plyr__control:hover,
        .plyr--video .plyr__control[aria-expanded=true] {
            background: var(--color-netflix-red) !important;
        }

        /* File Information Card */
        .feature-info-card {
            background: var(--gradient-feature-card-gradient);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-cards);
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        .file-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--color-chalk-white);
            margin-bottom: 12px;
            word-break: break-word;
        }

        .file-meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .meta-pill {
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-silver);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .meta-pill.highlight {
            background: rgba(229, 9, 20, 0.15);
            border-color: rgba(229, 9, 20, 0.5);
            color: var(--color-chalk-white);
        }

        /* Theatrical Actions Grid */
        .actions-shelf {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-cta-netflix {
            background: var(--color-netflix-red);
            color: var(--color-chalk-white);
            border: none;
            border-radius: var(--radius-buttons);
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-cta-netflix:hover {
            background: #c10712;
            color: var(--color-chalk-white);
        }

        .btn-cta-netflix:active {
            transform: scale(0.98);
        }

        .btn-action-netflix {
            background: rgba(22, 22, 22, 0.7);
            color: var(--color-chalk-white);
            border: 1px solid var(--color-slate);
            border-radius: var(--radius-buttons);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action-netflix:hover {
            background: var(--color-charcoal);
            border-color: var(--color-chalk-white);
            color: var(--color-chalk-white);
        }

        /* Footer */
        .footer {
            padding: 32px 36px;
            font-size: 13px;
            color: var(--color-silver);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--color-deep-space);
            text-align: center;
        }

        .footer a {
            color: var(--color-silver);
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--color-chalk-white);
        }

        @media (max-width: 768px) {
            .netflix-navbar {
                padding: 14px 20px;
            }
            .theater-wrapper {
                padding: 0 16px;
                margin-top: 16px;
            }
            .file-title {
                font-size: 20px;
            }
            .actions-shelf {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-cta-netflix, .btn-action-netflix {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Netflix Navigation -->
    <header class="netflix-navbar">
        <a class="brand-logo" href="/">
            SURF-TG
        </a>
        <form id="signoutForm" action="/logout" method="post" class="m-0" role="logout">
            <button type="submit" class="btn-netflix-header"><i class="bi bi-box-arrow-left"></i> Sign Out</button>
        </form>
    </header>

    <!-- Theater Mode Stage -->
    <main class="theater-wrapper">
        <div class="video-player-container">
            <video controls crossorigin playsinline data-poster="<!-- Poster -->" id="player">
                <source src="#" type="video/mp4" />
            </video>
        </div>

        <div class="feature-info-card">
            <h1 class="file-title"><!-- Filename --></h1>
            <div class="file-meta-row">
                <span class="meta-pill highlight"><i class="bi bi-play-circle-fill"></i> Stream Ready</span>
                <span class="meta-pill"><i class="bi bi-hdd-fill"></i> <!-- Size --></span>
                <span class="meta-pill"><i class="bi bi-shield-check"></i> Direct Telegram MTProto</span>
            </div>
        </div>

        <div class="actions-shelf">
            <button onclick="download()" class="btn-cta-netflix">
                <i class="bi bi-download"></i> Download Video
            </button>
            <button onclick="vlc_player()" class="btn-action-netflix">
                <i class="bi bi-cone-striped"></i> VLC Player
            </button>
            <button onclick="mx_player()" class="btn-action-netflix">
                <i class="bi bi-play-btn-fill"></i> MX Player
            </button>
            <button onclick="km_player()" class="btn-action-netflix">
                <i class="bi bi-collection-play"></i> KM Player
            </button>
            <button onclick="get_file()" class="btn-action-netflix">
                <i class="bi bi-telegram"></i> Bot Direct Link
            </button>
            <button onclick="copyUrl()" class="btn-action-netflix">
                <i class="bi bi-clipboard"></i> Copy Stream URL
            </button>
        </div>
    </main>

    <footer class="footer">
        <div>
            Surf-TG Digital Shelf &bull; Theatrical Cinema Experience &bull;
            &copy; 2026 <a href="https://github.com/weebzone/Surf-TG" target="_blank" rel="noreferrer">Surf-TG</a>
        </div>
    </footer>

    <script>
        const videolink = window.location.href;
        const url = new URL(videolink);
        const domainUrl = url.origin;
        const videoIdWithParams = videolink.split('/').pop();
        const videoId = videoIdWithParams.split('?')[0];
        const idParam = new URLSearchParams(window.location.search).get('id');
        const hashParam = new URLSearchParams(window.location.search).get('hash');
        const encodedName = encodeURIComponent('<!-- Filename -->');

        const downloadlink = `${domainUrl}/${videoId}/${encodedName}?id=${idParam}&hash=${hashParam}`;

        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            hideControls: false,
            keyboard: { focused: true, global: true },
            loop: { active: false },
        });

        function mx_player() {
            window.location.href = `intent:${downloadlink}#Intent;package=com.mxtech.videoplayer.ad;end`;
        }

        function vlc_player() {
            window.location.href = `vlc://${downloadlink}`;
        }

        function km_player() {
            window.location.href = `intent:${downloadlink}#Intent;package=com.kmplayer;end`;
        }

        function download() {
            window.location.href = downloadlink;
        }

        function get_file() {
            const regex = /(\d+)\?id=(\d+)&/;
            const match = videolink.match(regex);
            if (match) {
                const chatId = "-100" + match[1];
                const messageId = match[2];
                window.location.href = `https://t.me/<!-- Username -->?start=file_${messageId}${chatId}`;
            }
        }

        function copyUrl() {
            navigator.clipboard.writeText(downloadlink)
                .then(() => {
                    alert('Direct streaming URL copied to clipboard!');
                })
                .catch((error) => {
                    console.error('Failed to copy URL: ', error);
                });
        }

        function updateVideoSource() {
            const videoElement = document.getElementById('player');
            if (videoElement) {
                videoElement.src = downloadlink;
            }
        }

        window.onload = function () {
            updateVideoSource();
        };
    </script>
</body>

</html>
