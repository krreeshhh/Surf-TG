<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/api/logo" type="image/png">
    <link rel="shortcut icon" href="/api/logo" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Xibflix — <!-- Filename --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/weebzone/weebzone/data/Surf-TG/css/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <style>
        :root {
            --color-netflix-red: #e50914;
            --color-deep-space: #000000;
            --color-graphite: #181818;
            --color-charcoal: #2a2a2a;
            --color-slate: #5a5a5a;
            --color-ash: #808080;
            --color-silver: #b3b3b3;
            --color-chalk-white: #ffffff;
            --font-netflix: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-cards: 12px;
            --radius-buttons: 4px;
            --plyr-color-main: #e50914;
            --plyr-video-background: #000000;
            --plyr-control-radius: 4px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-deep-space);
            color: var(--color-chalk-white);
            font-family: var(--font-netflix);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-charcoal);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-slate);
        }

        /* Netflix Header */
        .netflix-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.75) 75%, transparent 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .btn-back {
            color: var(--color-chalk-white);
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: var(--radius-buttons);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.18);
            color: var(--color-chalk-white);
        }

        .brand-logo-img {
            height: 38px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .btn-netflix-header {
            background: rgba(0, 0, 0, 0.4);
            color: var(--color-chalk-white);
            border: 1px solid var(--color-ash);
            border-radius: var(--radius-buttons);
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-netflix-header:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-chalk-white);
            border-color: var(--color-chalk-white);
        }

        /* Theater Stage */
        .theater-stage {
            max-width: 1320px;
            width: 94%;
            margin: 20px auto 40px;
            flex: 1;
        }

        .player-viewport {
            width: 100%;
            background: #000000;
            border-radius: var(--radius-cards);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .plyr {
            border-radius: var(--radius-cards);
            max-height: 74vh;
            width: 100%;
        }

        .plyr__control--overlaid {
            background: rgba(229, 9, 20, 0.9) !important;
            padding: 22px !important;
            border-radius: 50% !important;
        }

        /* Cinema Details Bar */
        .cinema-details {
            background: linear-gradient(149deg, #192247, #210e17);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-cards);
            padding: 24px 28px;
            margin-top: 18px;
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .video-title {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
            color: var(--color-chalk-white);
            margin: 0;
            word-break: break-word;
            flex: 1;
        }

        .tags-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag-pill {
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-silver);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tag-pill.accent {
            background: rgba(229, 9, 20, 0.2);
            border-color: var(--color-netflix-red);
            color: #ff6b72;
        }

        .tag-pill.hd {
            font-weight: 800;
            letter-spacing: 0.5px;
            border-color: rgba(255, 255, 255, 0.4);
            color: var(--color-chalk-white);
        }

        /* Action Toolbar */
        .action-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-netflix-download {
            background: var(--color-netflix-red);
            color: var(--color-chalk-white);
            border: none;
            border-radius: var(--radius-buttons);
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-netflix-download:hover {
            background: #c10712;
            color: var(--color-chalk-white);
            transform: translateY(-1px);
        }

        .btn-netflix-chip {
            background: rgba(255, 255, 255, 0.08);
            color: var(--color-chalk-white);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: var(--radius-buttons);
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-netflix-chip:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--color-chalk-white);
            color: var(--color-chalk-white);
            transform: translateY(-1px);
        }

        /* Footer */
        .footer {
            padding: 28px 36px;
            font-size: 13px;
            color: var(--color-silver);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--color-deep-space);
            text-align: center;
        }

        .footer a {
            color: var(--color-silver);
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--color-chalk-white);
        }

        @media (max-width: 768px) {
            .netflix-navbar {
                padding: 12px 18px;
            }
            .theater-stage {
                width: 100%;
                padding: 0 12px;
                margin-top: 10px;
            }
            .cinema-details {
                padding: 18px 16px;
            }
            .video-title {
                font-size: 18px;
            }
            .action-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-netflix-download, .btn-netflix-chip {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Netflix Navigation -->
    <header class="netflix-navbar">
        <div class="nav-left">
            <a href="/" class="btn-back">
                <i class="bi bi-chevron-left"></i> Home
            </a>
            <a href="/">
                <img src="/api/logo" alt="XIBFLIX" class="brand-logo-img">
            </a>
        </div>
        <form id="signoutForm" action="/logout" method="post" class="m-0" role="logout">
            <button type="submit" class="btn-netflix-header"><i class="bi bi-box-arrow-left"></i> Sign Out</button>
        </form>
    </header>

    <!-- Theatrical Stage -->
    <main class="theater-stage">
        <div class="player-viewport">
            <video controls crossorigin playsinline data-poster="<!-- Poster -->" id="player">
                <source src="#" type="video/mp4" />
            </video>
        </div>

        <div class="cinema-details">
            <div class="title-row">
                <h1 class="video-title"><!-- Filename --></h1>
                <div class="tags-row">
                    <span class="tag-pill hd">HD</span>
                    <span class="tag-pill accent"><i class="bi bi-broadcast"></i> Ultra Stream</span>
                    <span class="tag-pill"><i class="bi bi-hdd-fill"></i> <!-- Size --></span>
                </div>
            </div>

            <div class="action-toolbar">
                <button onclick="download()" class="btn-netflix-download">
                    <i class="bi bi-download"></i> Download Video
                </button>
                <button onclick="vlc_player()" class="btn-netflix-chip">
                    <i class="bi bi-cone-striped"></i> VLC Player
                </button>
                <button onclick="mx_player()" class="btn-netflix-chip">
                    <i class="bi bi-play-circle-fill"></i> MX Player
                </button>
                <button onclick="km_player()" class="btn-netflix-chip">
                    <i class="bi bi-collection-play-fill"></i> KM Player
                </button>
                <button onclick="get_file()" class="btn-netflix-chip">
                    <i class="bi bi-telegram"></i> Telegram Bot
                </button>
                <button onclick="copyUrl()" class="btn-netflix-chip">
                    <i class="bi bi-link-45deg"></i> Copy Link
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div>
            Xibflix Digital Shelf &bull; Theatrical Cinema Experience &bull;
            &copy; 2026 Xibflix
        </div>
    </footer>

    <script>
        const videolink = window.location.href;
        const url = new URL(videolink);
        const domainUrl = url.origin;
        const videoIdWithParams = videolink.split('/').pop();
        const videoId = videoIdWithParams.split('?')[0];
        const idParam = new URLSearchParams(window.location.search).get('id');
        const hashParam = new URLSearchParams(window.location.search).get('hash');
        const encodedName = encodeURIComponent('<!-- Filename -->');

        const downloadlink = `${domainUrl}/${videoId}/${encodedName}?id=${idParam}&hash=${hashParam}`;

        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            hideControls: false,
            keyboard: { focused: true, global: true },
            loop: { active: false },
        });

        function mx_player() {
            window.location.href = `intent:${downloadlink}#Intent;package=com.mxtech.videoplayer.ad;end`;
        }

        function vlc_player() {
            window.location.href = `vlc://${downloadlink}`;
        }

        function km_player() {
            window.location.href = `intent:${downloadlink}#Intent;package=com.kmplayer;end`;
        }

        function download() {
            window.location.href = downloadlink;
        }

        function get_file() {
            const regex = /(\d+)\?id=(\d+)&/;
            const match = videolink.match(regex);
            if (match) {
                const chatId = "-100" + match[1];
                const messageId = match[2];
                window.location.href = `https://t.me/<!-- Username -->?start=file_${messageId}${chatId}`;
            }
        }

        function copyUrl() {
            navigator.clipboard.writeText(downloadlink)
                .then(() => {
                    alert('Direct streaming URL copied to clipboard!');
                })
                .catch((error) => {
                    console.error('Failed to copy URL: ', error);
                });
        }

        function updateVideoSource() {
            const videoElement = document.getElementById('player');
            if (videoElement) {
                videoElement.src = downloadlink;
            }
        }

        window.onload = function () {
            updateVideoSource();
        };
    </script>
</body>

</html>
